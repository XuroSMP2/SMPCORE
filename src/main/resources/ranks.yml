# Ränge im Stil der Tab-Liste: fetter Rang-Name + Spielername in passender Farbe.
# Reihenfolge (oben = wichtigster): OWNER, SRADMIN, ADMIN, SRMOD, MOD, MEDIA, FAMOUS, FREUND, VIP, ULTRA, MVP, ELITE, PREMIUM, SPIELER
# prefix = Chat-, Tab- und Nametag-Prefix (MiniMessage, Verläufe mit <gradient:#farbe1:#farbe2>). Die Farbe am Ende färbt den Spielernamen.
# weight = Sortierung in der Tab-Liste (höher = weiter oben)
# homes / listings = Limits für Homes bzw. AH-Angebote (0 = vom vererbten Rang bzw. config.yml)
# afk-bonus = Prozent-Bonus auf AFK-Stars
# sign-limit = /sign-Nutzungen pro Tag
# ec-rows = Reihen der erweiterten Endertruhe (3-6, wird nach oben vererbt)
# permissions = Permission-Nodes dieses Ranges. Ränge erben alles vom "inherits"-Rang.
#   Dieses Plugin: smpcore.cmd.<heal|feed|fly|craft|ec|trash|vanish|others>, smpcore.kit.<rang>, smpcore.tp.bypass, smpcore.admin
#   (smpcore.admin = alles). Für andere Plugins einfach deren Nodes eintragen, z.B. worldedit.* oder essentials.fly.
#   Ein "-" davor entzieht eine Permission.
# (alt:) permissions = Permission-Nodes ("-node" entzieht eine Permission), inherits = erbt von anderen Rängen
# Zuweisen: /rank set <Spieler> <Rang>  oder  Admin Panel (/ap -> Spieler -> Rang)
default-rank: spieler
ranks:
  spieler:
    display: "<gray>Spieler"
    prefix: "<dark_gray>[</dark_gray><gray>Spieler</gray><dark_gray>]</dark_gray> <gray>"
    weight: 0
    homes: 3
    listings: 10
    sign-limit: 1
    ec-rows: 3
    permissions: [smpcore.kit.starter]
  premium:
    display: "<gradient:#7dff7d:#00c853><bold>PREMIUM</bold></gradient>"
    prefix: "<dark_gray>[</dark_gray><gradient:#7dff7d:#00c853><bold>PREMIUM</bold></gradient><dark_gray>]</dark_gray> <#7dff7d>"
    weight: 10
    inherits: [spieler]
    homes: 5
    listings: 15
    afk-bonus: 10
    sign-limit: 2
    ec-rows: 3
    permissions: [smpcore.cmd.trash, smpcore.kit.premium, smpcore.cmd.ptime]
  elite:
