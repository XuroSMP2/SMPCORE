# ===== SMPCore =====
server-name: "XUROSMP"          # Platzhalter %server%
server-ip: "xurosmp.daronlo.com" # Platzhalter %ip% (klein) und %IP% (GROSS) in Scoreboard und TAB
number-comma: true              # true = 48,64M (deutsch) | false = 48.64M

# Chat-Prefix pro Befehl: "AH ▸", "HOME ▸", "ORDER ▸" ... (maximal 5 Zeichen, MiniMessage-Farben erlaubt)
# Bedrock-Hinweis: Falls "▸" bei Bedrock-Spielern nicht angezeigt wird, hier z.B. auf "»" ändern.
prefix-format: "<green><bold>%tag%</bold> <dark_gray>▸ <gray>"
prefixes:
  default: "SMP"
  advent: "ADVNT"
  xmas: "XMAS"
  gift: "GIFT"
  balance: "MONEY"
  pay: "PAY"
  eco: "ECO"
  crystals: "STARS"
  crystalshop: "STARS"
  gems: "GEMS"
  gemshop: "GEMS"
  top: "TOP"
  shop: "SHOP"
  sell: "SELL"
  ah: "AH"
  bounty: "BNTY"
  crate: "KEYS"
  keyall: "KEYS"
  adminpanel: "ADMIN"
  smpcore: "SMP"
  rank: "RANK"
  bank: "BANK"
  verify: "LINK"
  spoof: "SPOOF"
  upgrades: "UP"
  manhunt: "HUNT"
  combat: "PVP"
  spawner: "SPAWN"
  tool: "TOOL"
  spawn: "SPAWN"
  setspawn: "SPAWN"
  sethome: "HOME"
  home: "HOME"
  delhome: "HOME"
  homes: "HOME"
  tpa: "TPA"
  tpaccept: "TPA"
  tpdeny: "TPA"
  rtp: "RTP"
  daily: "DAILY"
  stats: "STATS"
  scoreboard: "SB"
  afk: "AFK"
  clan: "CLAN"
  order: "ORDER"
  warp: "WARP"
  setwarp: "WARP"
  delwarp: "WARP"
  kit: "KIT"
  back: "BACK"
  msg: "MSG"
  r: "MSG"
  heal: "HEAL"
  feed: "FEED"
  fly: "FLY"
  craft: "CRAFT"
  ec: "EC"
  trash: "TRASH"
  vanish: "HIDE"
  info: "INFO"
  dim: "DIM"
  sign: "SIGN"
  live: "LIVE"
  holo: "HOLO"
  announce: "NEWS"
  border: "BORD"
  battlepass: "PASS"
  pass: "PASS"
  farmmode: "FARM"
  hat: "HAT"
  repair: "FIX"
  near: "NEAR"
  seen: "SEEN"
  rules: "RULES"
  wiki: "WIKI"
  tpahere: "TPA"
  invsee: "SEE"
  ecsee: "SEE"
  gm: "GM"
  freeze: "FREEZ"
  mute: "MUTE"
  unmute: "MUTE"
  clearchat: "CHAT"
  skull: "SKULL"
  rename: "NAME"
  ptime: "TIME"
  smptools: "TOOLS"

# Floodgate/Geyser: Prefix für Bedrock-Namen (Standard ".")
bedrock-prefix: "."

# Diese Items werden NIE in Shops (/shop, Stars-Shop, Gem-Shop) und Crates angeboten.
# Elytra gibt es so nur im End, im Auktionshaus (/ah) und über Orders (/order).
shop-blacklist: [ELYTRA]

# Dimensionen manuell öffnen/schließen (auch im Admin Panel oder per /dimension <nether|end> <on|off>)
dimensions:
  nether: true
  end: true

# /sign: Item in der Hand signieren. Standard 1x pro Tag, Ränge können mehr (sign-limit in ranks.yml)
sign:
  daily-limit: 1

# Wartungsmodus: nur Spieler mit smpcore.admin dürfen joinen (auch im Admin Panel schaltbar)
maintenance: false

chat:
  rank-format: true   # Rang-Prefix im Chat

# Features an/aus (geht auch im Admin Panel)
features:
  settings: true
  shop: true
  auction: true
  bounty: true
  crates: true
  scoreboard: true
  orders: true
  bank: true
  combat: true
  spoof: true
  upgrades: true
  manhunt: true

economy:
  starting-money: 1000
  starting-crystals: 0     # Stars = AFK-Währung
  starting-gems: 0         # Gems = Store-Währung
  # Geld-Audit: Gutschriften ab diesem Betrag landen in plugins/SMPCore/economy-audit.log (Zeit, Spieler, Betrag, Auslöser im Code).
  audit-threshold: 1000000 # 0 = Audit aus
  audit-alarm: 1000000000  # ab diesem Betrag Warnung im Chat an online Admins

# Stars = AFK-Währung (verdient in der AFK-Zone, ausgegeben im Stars-Shop /crystalshop).
# Optional zusätzlich pro Kill / Spielzeit (Standard: aus):
crystals:
  per-kill: 0
  anti-farm-minutes: 10
  playtime-minutes: 0
  playtime-amount: 1

# AFK-Zone: Admin setzt sie mit /afk pos1, /afk pos2, /afk setspawn. Spieler kommen mit /afk hin.
afk:
  block-material: DIAMOND_BLOCK   # Material des AFK-Blocks (Upgrade afk-block)
  enabled: true
  interval-seconds: 60     # alle X Sekunden in der Zone
  crystals: 1              # Stars pro Intervall (Rang-Bonus siehe ranks.yml: afk-bonus)

# Clans
clans:
  create-cost: 50000
  max-members: 10

# Automatischer Keyall: alle X Minuten bekommen alle Online-Spieler Keys
keyall:
  enabled: true
  interval-minutes: 60
  crate: common
  amount: 1

auction:
  max-listings: 10          # Standard, Ränge können das in ranks.yml überschreiben
  duration-hours: 48
  tax-percent: 5
  min-price: 1
  max-price: 1000000000000

bounty:
  min-amount: 1000

crates:
  broadcast-chance-below: 5.0   # Gewinne mit weniger als X% Chance werden gebroadcastet

teleport:
  delay-seconds: 3

homes:
  max-shares: 5   # mit wie vielen Spielern ein Home geteilt werden darf (/home share)
  max: 3                    # Standard, Ränge können das in ranks.yml überschreiben

rtp:
  cooldown-seconds: 60
  worlds:
    overworld: {enabled: true, world: world, min-radius: 500, max-radius: 5000}
    nether: {enabled: false, world: world_nether, min-radius: 200, max-radius: 2000}   # manuell freischalten: enabled: true (oder Admin Panel)
    end: {enabled: false, world: world_the_end, min-radius: 1000, max-radius: 3000}


daily:
  money: 500
  streak-bonus: 100      # pro Streak-Tag zusätzlich
  max-streak: 7
  crystals: 0          # Stars sind AFK-Währung, daher standardmäßig 0

# Orders (Kaufaufträge): /order. Geld wird beim Erstellen reserviert, Lieferanten werden sofort bezahlt.
orders:
  input: SIGN            # SIGN = Eingabe per Schild (auch Bedrock), CHAT = per Chat
  max-per-player: 5
  duration-hours: 72
  min-price: 0.01
  max-amount: 2304
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, STRUCTURE_VOID, JIGSAW, DEBUG_STICK, SPAWNER, LIGHT]

# Eigene TAB-Liste: Header/Footer, Name mit [CLAN] + Rang-Prefix (+ roter Punkt bei /live), Sortierung nach Rang.
# nametag-prefix: Rang-Prefix auch über dem Kopf. Platzhalter wie beim Scoreboard.
tab:
  enabled: true
  nametag-prefix: true
  name-color: "<white>"
  header:
  - ""
  - "<#B132E7>⚔ <#BC36EB>X<#C239ED>U<#C73BEF>R<#CD3DF1>O<#D33FF2>S<#D841F4>M<#DE44F6>P <#E948FA>⚔"
  - ""
  - "<green>%online% Spieler <gray>(%ping%ms)"
  - ""
  footer:
  - ""
  - "<#E43A96>X<#D144AA>U<#BE4FBF>R<#AB59D3>O<#9863E7>S<#AB59D3>M<#BE4FBF>P<#D144AA>.<#E43A96>D<#D144AA>A<#BE4FBF>R<#AB59D3>O<#9863E7>N<#BE4FBF>L<#E43A96>O<#BE4FBF>.<#9863E7>C<#E43A96>OM"
  - ""

# Announcer: automatische Chat-Nachrichten
announcer:
  enabled: true
  interval-seconds: 300
  messages:
    - "<yellow>Tipp: <gray>Mit <white>/afk <gray>verdienst du Stars in der AFK-Zone!"
    - "<yellow>Tipp: <gray>Im <white>/shop <gray>kannst du kaufen und verkaufen."
    - "<yellow>Tipp: <gray>Mit <white>/order <gray>bestellst du Items zu deinem Preis."
    - "<yellow>Tipp: <gray>Gründe einen Clan mit <white>/clan<gray>!"
    - "<yellow>Tipp: <gray>Hol dir kostenlose Kits mit <white>/kit<gray>."

# Scoreboard im XuroSMP-Look.
# Platzhalter: %player% %money% %gems% %crystals% %kills% %deaths% %playtime% %online% %max% %bounty% %ping% %rank% %keyall% %clan% %server% %ip% %IP%
# Stars = %crystals% (AFK-Währung).
scoreboard:
  title: "<#B132E7>X<#BA36EA>U<#C439ED>R<#CD3DF1>O<#D641F4>S<#E044F7>M<#E948FA>P"
  lines:
  - "<bold><#856DF8>| <white>Geld <green>%money% $"
  - "<#856DF8><bold>| <white>Gems <light_purple>%gems%"
  - "<#856DF8><bold>| <white>Stars <yellow>%crystals%"
  - "<#856DF8><bold>| <white>Kills <gold>%kills%"
  - "<#856DF8><bold>| <white>Tode <red>%deaths%"
  - "<#856DF8><bold>| <white>Clan <yellow>%clan%"
  - "<#856DF8><bold>| <white>Ping <green>%ping%ms"
  - "<#856DF8><bold>| <white>Keyall <aqua>%keyall%"
  - "<#856DF8><bold>| <white>Spielzeit <green>%playtime%"
  - "<#E43A96>X<#D144AA>U<#BE4FBF>R<#AB59D3>O<#9863E7>S<#AB59D3>M<#BE4FBF>P<#D144AA>.<#E43A96>D<#D144AA>A<#BE4FBF>R<#AB59D3>O<#9863E7>N<#BE4FBF>L<#E43A96>O<#BE4FBF>.<#9863E7>C<#E43A96>OM"
  - "<green>%online%/%max%"

# ===== Jedes Item verkaufbar =====
# Items ohne festen Preis in shop.yml bekommen automatisch einen Preis (nach Art des Items).
sell:
  all-items: true
  multiplier: 1.0          # alle Auto-Preise x Faktor
  default-price: 1.0       # Preis für alles, was keine Regel trifft
  blacklist: []            # Items, die nie verkaufbar sind, z.B. [ENDER_CHEST]

# ===== /live =====
live:
  dot: "<red>●"
  announce-cooldown-minutes: 10
  allowed-domains: [twitch.tv, youtube.com, youtu.be, kick.com, tiktok.com]

# ===== Leaderboard-Hologramme (/holo) =====
holograms:
  update-minutes: 30       # auch per /holo interval <Minuten>

# ===== Farm-Modus (/farmmode): Stein = XP, Erze = Stars =====
farmmode:
  enabled: true
  stone-xp: 2
  max-stars-per-day: 3000
  stone: [STONE, COBBLESTONE, DEEPSLATE, COBBLED_DEEPSLATE, ANDESITE, DIORITE, GRANITE, TUFF, NETHERRACK, BASALT, BLACKSTONE, END_STONE]
  ores:                    # Stars pro Erz (gilt auch für die DEEPSLATE-Variante)
    COAL: 1
    COPPER: 1
    IRON: 2
    GOLD: 3
    NETHER_GOLD: 2
    REDSTONE: 2
    LAPIS: 3
    NETHER_QUARTZ: 2
    EMERALD: 6
    DIAMOND: 8
    ANCIENT_DEBRIS: 15

near:
  radius: 100
repair:
  cooldown-seconds: 3600

# ===== /wiki und /rules =====
links:
  wiki: ""                 # z.B. https://dein-wiki.netlify.app
rules:
  - "<gray>1. <white>Allgemeines: Mit dem Beitritt akzeptierst du die Regeln. Anweisungen des Teams sind zu befolgen. Regellücken auszunutzen ist ebenfalls ein Verstoß."
  - "<gray>2. <white>Community: Respekt, keine Beleidigungen, Mobbing oder Diskriminierung. Griefing bleibt im Spiel, keine Drohungen oder Beleidigungen deswegen. Kein Spam."
  - "<gray>3. <white>Gameplay: Keine Cheats, Hacks, X-Ray oder unerlaubte Mods. Bugs und Exploits nicht ausnutzen, sondern melden. Keine Lag-Farmen."
  - "<gray>4. <white>Griefing ist erlaubt: Fremde Bauten dürfen zerstört und geplündert werden, das Team stellt nichts wieder her. Nicht erlaubt: Griefing mit Cheats oder Lag-Maschinen sowie Schäden an Spawn, Warps und Team-Bauten."
  - "<gray>5. <white>PvP: Überall erlaubt, außer in gekennzeichneten Bereichen. Kein Spawnkilling, kein Combat-Logging. Items aus Kisten und Todesdrops dürfen genommen werden."
  - "<gray>6. <white>Handel: Fair und freiwillig. Kein Betrug, keine duplizierten Items oder Exploit-Ressourcen, keine Preismanipulation."
  - "<gray>7. <white>Discord: Die Discord-Regeln gelten zusätzlich. Keine Werbung, keine schädlichen Links, keine privaten Daten anderer."
  - "<gray>8. <white>Accounts: Kein Ban-Umgehen mit Zweitaccounts, keine fremden Accounts nutzen, keine Manipulation von Plugins."
  - "<gray>9. <white>Inhalte: Keine pornografischen, extremen, illegalen oder diskriminierenden Inhalte oder Links."
  - "<gray>10. <white>Support: Probleme per Ticket oder an das Team melden. Strafen nicht öffentlich diskutieren."
  - "<gray>11. <white>Strafen: Verwarnung, Timeout, Kick, temporärer oder permanenter Bann je nach Schwere."
  - "<gray>Gilt auch auf Discord. Alle Regeln im Wortlaut: <white>/wiki"

# ===== Spezial-Tools (/smptools give <Spieler> <Tool> [Zeit]) =====
# Ohne Zeitangabe gehen die Tools nach dieser Zeit kaputt. Format: 3d, 12h, 1d12h, 30m; 0 = unbegrenzt.
tools:
  default-duration: 3d

# ===== Endertruhe =====
# Reihen je Rang stehen in ranks.yml (ec-rows). Standard für Ränge ohne Angabe:
enderchest:
  default-rows: 3

# ===== Resource-Pack (nur Java; Bedrock-Spieler bekommen automatisch die Unicode-Fallbacks) =====
# 1. Pack-ZIP (resourcepack/XuroSMP-Pack.zip) irgendwo mit DIREKTEM Download-Link hosten (z.B. GitHub: Raw-Link der Datei im öffentlichen Repo)
# 2. url und sha1 (steht in resourcepack/SHA1.txt) hier eintragen, enabled auf true
# Das Pack enthält: lila "Crystal"-Ausrüstung, rote/orange Hammer/Excavator, Scoreboard-Icons und TAB-Logo.
resourcepack:
  enabled: false
  url: ""
  sha1: "453e7464bf0ba4737bc6da50a008306ba216038d"
  force: false
  # Weihnachts-Pack: wird in der Saison (27.11.-06.01.) statt des normalen Packs geschickt. XuroSMP-Weihnachten.zip hosten, Link + SHA-1 eintragen.
  xmas: {enabled: false, url: "", sha1: ""}
  prompt: "<yellow>XuroSMP Resource-Pack: schönere Tools, Scoreboard und TAB-Liste!"
  logo: {glyph: "\uE100", fallback: "<aqua><bold>⚔ %server% ⚔"}
  icons:
    money: {glyph: "\uE000", fallback: "<green>$"}
    gems: {glyph: "\uE001", fallback: "<light_purple>♦"}
    stars: {glyph: "\uE002", fallback: "<yellow>★"}
    kills: {glyph: "\uE003", fallback: "<gray>⚔"}
    deaths: {glyph: "\uE004", fallback: "<dark_red>☠"}
    clan: {glyph: "\uE005", fallback: "<gold>⚑"}
    ping: {glyph: "\uE006", fallback: "<aqua>⚡"}
    keyall: {glyph: "\uE007", fallback: "<aqua>✦"}
    time: {glyph: "\uE008", fallback: "<green>⌚"}

# ===== Bankkonten (/bank) =====
# Geld auf dem Konto ist sicher vor dem Tod und kann nicht per /pay verschickt werden. Zinsen gibt es für aktive Spieler.
bank:
  max-balance: 0              # max. Guthaben pro Konto (0 = unbegrenzt)
  interest-percent: 1.0       # Zinsen pro Auszahlung in Prozent (0 = keine Zinsen)
  interest-minutes: 60        # alle X Minuten
  interest-max: 25000         # max. Zinsen pro Auszahlung und Spieler (0 = kein Limit)
  interest-min-balance: 100   # erst ab diesem Guthaben gibt es Zinsen
  interest-active-days: 7     # nur Spieler, die in den letzten X Tagen online waren, bekommen Zinsen
  max-accounts: 3             # zusätzliche (teilbare) Konten pro Spieler: /bank create <Name>
  account-create-cost: 5000   # Bargeld-Preis für ein zusätzliches Konto (0 = gratis)
  max-members: 5              # Mitglieder pro geteiltem Konto: /bank share <Konto> <Spieler>

# ===== Combat-Tag =====
# Wer kämpft, ist X Sekunden im Kampf: Befehle (inkl. Teleports/Menüs) gesperrt, Ausloggen = Tod mit Item-Verlust.
# Bypass: Permission smpcore.combat.bypass (Team). Creative/Spectator/Vanish werden nicht getaggt.
combat:
  duration-seconds: 15
  kill-on-logout: true
  disabled-worlds: []
  allowed-commands: [msg, tell, w, whisper, r, reply, m, t, helpop, report, ignore, discord, rules]

# ===== Web-API (schreibgeschützt, für Websites) =====
# Endpoints (Header X-API-Key nötig):
#   GET /api/status | /api/players/online | /api/top/{money|crystals|gems|kills|deaths|playtime}?limit=10
#   GET /api/player/{name|uuid} | /api/clans | /api/clans/{name}
# Zum Aktivieren: enabled auf true und api-key auf einen langen Zufallswert (min. 16 Zeichen) setzen, dann /smpcore reload oder Neustart.
# Den Port (Standard 8085) in der Firewall/beim Hoster freigeben. Besser: über Reverse-Proxy mit HTTPS ausliefern.
# WICHTIG: Den Key nie im Browser-JavaScript verwenden – Aufrufe immer vom Server deiner Website aus machen.
web-api:
  enabled: false
  api-key: "CHANGE-ME-TO-A-LONG-RANDOM-KEY"
  bind: "0.0.0.0"            # "127.0.0.1" = nur lokal (z. B. Website läuft auf demselben Server / Reverse-Proxy)
  port: 8085
  refresh-seconds: 30        # wie oft die Daten aktualisiert werden
  max-top: 50                # max. Einträge pro Bestenliste im Cache
  rate-limit-per-minute: 120 # pro IP
  cors-origin: ""            # z. B. "https://deine-seite.de" (nur nötig, wenn der Browser direkt zugreift)
  trust-proxy: false         # true = X-Forwarded-For für das Rate-Limit nutzen (nur hinter eigenem Reverse-Proxy!)
  # Push-Modus (empfohlen, wenn der Hoster keinen Extra-Port erlaubt): Der Server SENDET die Daten per HTTPS an deine Website.
  # Dafür muss KEIN Port offen sein. 'enabled' (oben) kann dann auf false bleiben. Nutzt denselben api-key.
  push:
    enabled: false
    url: "https://DEINE-SEITE.netlify.app/api/ingest"   # XuroWeb (leer lassen, wenn nicht genutzt)
    market-url: ""           # XuroMarket, z. B. "https://DEIN-MARKT.netlify.app/api/ingest" (AH, Orders, Preise, Vermögen, RTP)
    interval-seconds: 120    # min. 30; Netlify Free: nicht zu klein wählen
    inventory-seconds: 90    # wie oft das Inventar verknüpfter Spieler (/verify) aktualisiert wird (min. 30, nur bei Änderungen)
    max-players: 3000        # so viele Spieler (nach Spielzeit) werden für die Spielersuche mitgeschickt

# /spoof - nur für den Owner (Permission smpcore.spoof, im Owner-Rang in ranks.yml enthalten)
spoof:
  allowed-players: []                      # optional: nur diese Namen dürfen spoofen, z. B. ["DeinName"]. Leer = jeder mit der Permission
  protected-ranks: [owner, sradmin, admin] # diese Ränge (und OPs) kann nur smpcore.spoof.admin spoofen

# ===== Manhunt (/manhunt <Spieler> <Preis> <Währung> <Zeit>) =====
# Der Preis wird beim Start abgezogen. Stirbt das Ziel, zeigt der Chat die Damage-Rangliste (Top 3) und zahlt aus.
# Läuft die Zeit ab (oder niemand hat Damage gemacht), bekommt der Auftraggeber alles zurück.
manhunt:
  payout-split: [50, 30, 20]   # Prozent für Platz 1/2/3, z. B. [100] = alles an Platz 1
  max-duration: 1d
  min-money: 1000
  min-stars: 10
  min-gems: 5

# ===== Bans (/ban, /tempban, /unban, /lookup, /banlist) =====
# Mods (Permission smpcore.cmd.ban) dürfen nur zeitlich bis mod-max-duration bannen; dauerhaft nur mit smpcore.ban.permanent (Admins).
ban:
  mod-max-duration: 7d
  require-reason: true
  broadcast: true          # false = Bans nur dem Team anzeigen
  appeal-text: ""          # z. B. "Entbannung: discord.gg/..." (steht im Kick-Bildschirm)

# End Crystals: eigenes, schweres Crafting-Rezept (formlos: Reihenfolge im Crafting-Gitter egal, max. 9 Zutaten).
# Funktioniert auch ohne diesen Block mit den Standardwerten unten. items = MATERIAL:Anzahl
endcrystal-recipe:
  enabled: true
  remove-vanilla: true     # Vanilla-Rezept (Glas + Ghast-Träne + Enderauge) entfernen
  amount: 1
  items: ["NETHERITE_SCRAP:3", "DIAMOND:2", "GHAST_TEAR:1", "GLASS:2", "ENDER_EYE:1"]

# Anti-Piechart / Anti-Base-Finding. Das F3-Piechart läuft im Client; serverseitig lässt es sich nur abmildern:
#  - reduced-debug-info: F3 zeigt keine Koordinaten und keine Chunk-Infos
#  - max-view-distance: begrenzte Sichtweite für Nicht-Admins (je weniger Chunks der Client hat, desto weniger kann er auswerten). 0 = aus
# Ausnahme: Permission smpcore.admin oder smpcore.antipiechart.bypass
anti-piechart:
  enabled: true
  reduced-debug-info: true
  max-view-distance: 10


# /settings: persönliche Einstellungen (Monster-Spawns, Scoreboard, Kontostand unter dem Namen, Nachrichten, TPA, Pay, Nachtsicht).
# Feature an/aus: features.settings. Nachtsicht braucht die Permission smpcore.settings.nightvision.
settings:
  mobspawn-radius: 64          # Spieler in diesem Umkreis zählen für "Monster-Spawns aus"
  balance-below-name: true     # Kontostand unter dem Namen (jeder Spieler kann es in /settings aus-/einschalten)

# ===== Weihnachten =====
# Adventskalender: startet automatisch am 1. Dezember. Türchen N lässt sich NUR am N. Dezember öffnen (kein Nachholen).
# Belohnungen pro Türchen: advent.yml.  Testen als Admin: /advent admin date 2026-12-05  (zurück: /advent admin date off)
advent:
  enabled: true
  timezone: "Europe/Berlin"
  test-date: ""
xmas:
  enabled: true            # Saison automatisch 27.11. bis 06.01.
  snow: true               # Schneeflocken um die Spieler (pro Spieler abschaltbar: /xmas snow)
  gift-enabled: true       # /gift <Spieler>
  crate: "weihnachten"     # wird automatisch angelegt, falls sie fehlt (Platzieren: /crate set weihnachten)
  bescherung-time: "18:00" # Heiligabend: alle Online-Spieler bekommen Keys + Gems
  bescherung-keys: 3
  bescherung-gems: 25
